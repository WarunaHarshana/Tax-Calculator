<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leasing Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom">
        <a href="leasing.html" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
            <svg class="bi me-2" width="40" height="32" aria-hidden="true"><use xlink:href="#bootstrap"></use></svg>
            <span class="fs-4">Leasing Calculator</span>
        </a>
        <ul class="nav nav-pills">
            <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
            <li class="nav-item"><a href="withholding.html" class="nav-link">Withholding Tax</a></li>
            <li class="nav-item"><a href="paye.html" class="nav-link">PAYE Tax</a></li>
            <li class="nav-item"><a href="income.html" class="nav-link">Income Tax</a></li>
            <li class="nav-item"><a href="sscl.html" class="nav-link">SSCL Tax</a></li>
            <li class="nav-item"><a href="leasing.html" class="nav-link active" aria-current="page">Leasing Calculations</a></li>
        </ul>
    </header>

    <div class="container">
        <div class="card" style="width: 100%; max-width: 750px; margin: 0 auto;">
            <div class="card-body p-4">
                <h2 class="card-title text-center mb-4">Leasing Plan Comparison</h2>

                <div class="mb-3">
                    <label for="loan-amount" class="form-label fw-bold">Loan Amount (Rs.):</label>
                    <input type="number" class="form-control" id="loan-amount" placeholder="e.g., 1000000" min="0">
                </div>
                
                <div class="mb-3">
                    <label for="annual-interest-rate" class="form-label fw-bold">Annual Interest Rate (%):</label>
                    <input type="number" class="form-control" id="annual-interest-rate" placeholder="e.g., 15" min="0">
                </div>

                <button id="calc-leasing-button" class="btn btn-primary w-100 py-2 fs-5">Calculate Installments</button>
                <button id="clear-leasing-button" class="btn btn-outline-secondary w-100 mt-2">Clear Fields</button>

                <div class="mt-4">
                    <div id="leasing-error-message" class="alert alert-danger d-none" role="alert"></div>
                    <div id="leasing-result-display" class="alert alert-success d-none"></div>
                </div>
            </div>
        </div>

        <hr class="my-5">

        <div class="card" style="width: 100%; max-width: 750px; margin: 0 auto; margin-bottom: 4rem;">
            <div class="card-body p-4">
                <h2 class="card-title text-center mb-4">Calculate Max Loan Value</h2>

                <div class="mb-3">
                    <label for="reverse-payment-amount" class="form-label fw-bold">Your Monthly Payment (Rs.):</label>
                    <input type="number" class="form-control" id="reverse-payment-amount" placeholder="e.g., 30000" min="0">
                </div>
                
                <div class="mb-3">
                    <label for="reverse-annual-rate" class="form-label fw-bold">Annual Interest Rate (%):</label>
                    <input type="number" class="form-control" id="reverse-annual-rate" placeholder="e.g., 15" min="0">
                </div>

                <div class="mb-3">
                    <label for="reverse-loan-term" class="form-label fw-bold">Loan Term (in Years):</label>
                    <input type="number" class="form-control" id="reverse-loan-term" placeholder="e.g., 5" min="0">
                </div>

                <button id="calc-reverse-button" class="btn btn-primary w-100 py-2 fs-5">Calculate Max Loan</button>
                <button id="clear-reverse-button" class="btn btn-outline-secondary w-100 mt-2">Clear Fields</button>

                <div class="mt-4">
                    <div id="reverse-error-message" class="alert alert-danger d-none" role="alert"></div>
                    <div id="reverse-result-display" class="alert alert-success d-none"></div>
                </div>
            </div>
        </div>
    </div> <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/leasing.js"></script>
</body>
</html>
