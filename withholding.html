<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WHT Calculator (Bootstrap)</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom"> 
      <a href="withholding.html" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
         <svg class="bi me-2" width="40" height="32" aria-hidden="true">
          <use xlink:href="#bootstrap"></use>
        </svg> 
        <span class="fs-4">Withholding Tax Calculator</span> 
      </a>
       <ul class="nav nav-pills">
         <li class="nav-item">
          <a href="index.html" class="nav-link">Home</a>
        </li>
        <li class="nav-item">
          <a href="withholding.html" class="nav-link active" aria-current="page">Withholding Tax</a>
        </li> 
        <li class="nav-item">
          <a href="paye.html" class="nav-link">PAYE Tax</a>
        </li>
        <li class="nav-item">
          <a href="income.html" class="nav-link">Income Tax</a>
        </li> 
        <li class="nav-item">
          <a href="sscl.html" class="nav-link">SSCL Tax</a>
        </li>
         <li class="nav-item">
          <a href="leasing.html" class="nav-link">Leasing Calculations</a>
        </li> 
      </ul> 
    </header>

    <div class="container d-flex justify-content-center">
        <div class="card" style="width: 100%; max-width: 750px;">
            <div class="card-body p-4">
                <h2 class="card-title text-center mb-4">WHT Calculator</h2>

                <div class="mb-3">
                    <label class="form-label fw-bold">Select Tax Type:</label>
                    
                    <div class="dropdown">
                        <button class="btn btn-outline-secondary dropdown-toggle w-100" type="button" id="tax-type-button" data-bs-toggle="dropdown" aria-expanded="false">
                            -- Please Select Tax Type --
                        </button>
                        <ul class="dropdown-menu w-100" aria-labelledby="tax-type-button">
                            <li><a class="dropdown-item" href="#" data-value="rent">Rent Tax</a></li>
                            <li><a class="dropdown-item" href="#" data-value="interest">Bank Interest Tax</a></li>
                            <li><a class="dropdown-item" href="#" data-value="dividend">Dividend Tax</a></li>
                        </ul>
                    </div>
                    
                    <input type="hidden" id="tax-type-value" value="">
                </div>

                <div class="mb-3">
                    <label for="amount" class="form-label fw-bold">Enter Amount (Rs.):</label>
                    <input type="number" class="form-control" id="amount" min="0">
                </div>

                <button id="calc-button" class="btn btn-primary w-100 py-2 fs-5">Calculate Tax</button>
                
                <button id="clear-button" class="btn btn-outline-secondary w-100 mt-2">Clear</button>

                <div class="mt-4 text-center">
                    <div id="error-message" class="alert alert-danger d-none" role="alert"></div>
                    <div id="result-display" class="alert alert-success d-none fs-5" role="alert"></div>
                </div>

            </div>
        </div>
    </div> <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/withholding.js"></script>
</body>
</html>
